# Version temporaire HTTP-only, le temps que certbot génère le certificat.
# Une fois `certbot --nginx -d api-parc.numerix.digital` exécuté, remplacer
# ce fichier par deploy/nginx-parc.conf (certbot peut aussi éditer ce
# fichier-ci directement pour ajouter le bloc HTTPS, au choix).

upstream parc_http {
    server 127.0.0.1:9014;
}

server {
    listen 80;
    server_name api-parc.numerix.digital;

    client_max_body_size 20M;

    location /static/ {
        alias /var/www/parc/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/parc/backend/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://parc_http;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300;
        proxy_read_timeout 300;
    }
}
