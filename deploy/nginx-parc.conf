# Nginx configuration for Parc Informatique API
# Copy to: /etc/nginx/sites-available/parc
# Link to: /etc/nginx/sites-enabled/parc

upstream parc_http {
    server 127.0.0.1:8010;
}

server {
    listen 80;
    server_name api-parc.numerix.digital;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api-parc.numerix.digital;

    ssl_certificate /etc/letsencrypt/live/api-parc.numerix.digital/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-parc.numerix.digital/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    access_log /var/log/nginx/parc_access.log;
    error_log /var/log/nginx/parc_error.log;

    client_max_body_size 20M;

    location /static/ {
        alias /var/www/parc/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/parc/backend/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://parc_http;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300;
        proxy_read_timeout 300;
    }
}
